[project]
name = "vectorcraft-scripting"
version = "0.1.0"
description = "Python bridge to VectorCraft's headless CLI for figure placement and export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
plotly = ["plotly", "kaleido"]
tables = ["pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorcraft_scripting"]
